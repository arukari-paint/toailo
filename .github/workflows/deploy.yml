name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx astro check
      - name: Build
        run: npx astro build
        env:
          # 独自ドメインに移すときは、リポジトリの Variables で SITE_URL / BASE_PATH を設定する
          SITE_URL: ${{ vars.SITE_URL || 'https://arukari-paint.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/toailo' }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - name: Check internal links
        run: node scripts/check-links.mjs
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/toailo' }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
